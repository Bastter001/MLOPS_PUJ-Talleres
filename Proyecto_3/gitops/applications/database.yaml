apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: proyecto3-database
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/Bastter001/MLOPS_PUJ-Talleres.git

    targetRevision: main

    path: Proyecto_3/gitops/manifests/database

  destination:
    server: https://kubernetes.default.svc

    namespace: mlops

  syncPolicy:
    automated:
      prune: false
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
