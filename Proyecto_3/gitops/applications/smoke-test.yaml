apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: proyecto3-smoke-test
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/Bastter001/MLOPS_PUJ-Talleres.git
    targetRevision: main
    path: Proyecto_3/gitops/manifests/smoke-test

  destination:
    server: https://kubernetes.default.svc
    namespace: proyecto3-gitops-test

  syncPolicy:
    syncOptions:
      - CreateNamespace=true
