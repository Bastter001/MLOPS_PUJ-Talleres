airflowVersion: 3.2.2
apiServer:
  replicas: 1
  resources:
    limits:
      cpu: 500m
      memory: 1Gi
    requests:
      cpu: 100m
      memory: 384Mi
config:
  core:
    load_examples: 'False'
    max_active_tasks_per_dag: '2'
    parallelism: '4'
    max_active_runs_per_dag: '1'
    dags_are_paused_at_creation: 'True'
createUserJob:
  defaultUser:
    enabled: false
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 512Mi
  enabled: false
dagProcessor:
  replicas: 1
  resources:
    limits:
      cpu: 500m
      memory: 1Gi
    requests:
      cpu: 100m
      memory: 256Mi
  logGroomerSidecar:
    resources:
      requests:
        cpu: 25m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 128Mi
dags:
  gitSync:
    enabled: false
  persistence:
    enabled: false
data:
  metadataSecretName: airflow-metadata
  brokerUrlSecretName: airflow-broker-url
env:
- name: DIABETES_CSV_PATH
  value: /opt/airflow/data/diabetic_data.csv
- name: MLFLOW_TRACKING_URI
  value: http://mlflow:5000
- name: DATA_API_URL
  value: http://data-api:80
- name: DATA_API_GROUP
  value: '8'
- name: DATA_API_DAY
  value: ''
- name: PROYECTO3_DB_HOST
  value: postgres
- name: PROYECTO3_DB_PORT
  value: '5432'
- name: PROYECTO3_DB_NAME
  value: proyecto3_data
- name: PROYECTO3_DB_USER
  value: proyecto3_training
- name: MLFLOW_EXPERIMENT_NAME
  value: proyecto3-real-estate
- name: REGISTERED_MODEL_NAME
  value: proyecto3-real-estate-price
- name: MODEL_ALIAS
  value: champion
- name: OMP_NUM_THREADS
  value: '2'
- name: OPENBLAS_NUM_THREADS
  value: '2'
- name: MKL_NUM_THREADS
  value: '2'
executor: LocalExecutor
images:
  airflow:
    repository: bastter/mlops-airflow
    tag: 292fdd4423e30c705ab30a03010ba59228a68b49
    digest: sha256:77ef31666dfb91b9def371747d086e194d23dd660d65c2405ea56dd29c2d3cb2
    pullPolicy: IfNotPresent
logs:
  persistence:
    enabled: false
pgbouncer:
  enabled: false
postgresql:
  enabled: false
redis:
  enabled: false
scheduler:
  replicas: 1
  resources:
    limits:
      cpu: '1'
      memory: 3Gi
    requests:
      cpu: 100m
      memory: 512Mi
  logGroomerSidecar:
    resources:
      requests:
        cpu: 25m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 128Mi
secret:
- envName: DIABETES_DATABASE_URL
  secretKey: connection
  secretName: diabetes-db
- envName: PROYECTO3_DB_PASSWORD
  secretName: proyecto3-db-credentials
  secretKey: TRAINING_PASSWORD
statsd:
  enabled: false
triggerer:
  enabled: false
fernetKeySecretName: airflow-fernet-key
apiSecretKeySecretName: airflow-api-secret-key
jwtSecretName: airflow-jwt-secret
migrateDatabaseJob:
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  enabled: false
