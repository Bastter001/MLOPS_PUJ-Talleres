name: Proyecto 3 - Build Airflow

on:
  push:
    branches:
      - main
    paths:
      - 'Proyecto_3/airflow/**'
      - '.github/workflows/proyecto3-airflow.yml'

  workflow_dispatch:

permissions:
  contents: read

jobs:

  build-airflow:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and publish Airflow
        uses: docker/build-push-action@v6
        with:
          context: ./Proyecto_3/airflow
          file: ./Proyecto_3/airflow/Dockerfile
          push: true
          build-args: |
            GIT_SHA=${{ github.sha }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/mlops-airflow:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
