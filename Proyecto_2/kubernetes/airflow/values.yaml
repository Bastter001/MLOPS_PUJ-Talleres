executor: LocalExecutor

postgresql:
  enabled: false

redis:
  enabled: false

data:
  metadataSecretName: airflow-metadata

config:
  core:
    load_examples: "False"
    parallelism: 2
    max_active_tasks_per_dag: 1

  scheduler:
    max_threads: 2

scheduler:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 3Gi

apiServer:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 384Mi
    limits:
      cpu: 500m
      memory: 1Gi

dagProcessor:
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      cpu: 300m
      memory: 768Mi

triggerer:
  enabled: false

statsd:
  enabled: false

dags:
  persistence:
    enabled: false
  gitSync:
    enabled: false

logs:
  persistence:
    enabled: false

airflowVersion: "3.2.2"

executor: LocalExecutor

images:
  airflow:
    repository: bastter/airflow-mlops
    tag: "3.2.2-v3"
    pullPolicy: IfNotPresent

postgresql:
  enabled: false

redis:
  enabled: false

pgbouncer:
  enabled: false

data:
  metadataSecretName: airflow-metadata

config:
  core:
    load_examples: "False"
    parallelism: 2
    max_active_tasks_per_dag: 1

scheduler:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 384Mi
    limits:
      cpu: 500m
      memory: 1Gi

apiServer:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 384Mi
    limits:
      cpu: 500m
      memory: 1Gi

dagProcessor:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi

triggerer:
  enabled: false

statsd:
  enabled: false

dags:
  persistence:
    enabled: false
  gitSync:
    enabled: false

logs:
  persistence:
    enabled: false

createUserJob:
  defaultUser:
    enabled: false

secret:
  - envName: DIABETES_DATABASE_URL
    secretName: diabetes-db
    secretKey: connection

env:
  - name: DIABETES_CSV_PATH
    value: /opt/airflow/data/diabetic_data.csv
  - name: MLFLOW_TRACKING_URI
    value: http://mlflow.mlops.svc.cluster.local:5000
