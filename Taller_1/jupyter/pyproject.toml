[project]

name = "taller-1-jupyter"

version = "0.1.0"

description = "Training environment MLOps PUJ"


requires-python = ">=3.10"


dependencies = [

    "jupyterlab>=4.6.4",

    "pandas>=2.3.3",

    "numpy>=2.2.6",

    "scikit-learn>=1.7.2",

    "joblib>=1.6.0",

    "matplotlib>=3.10.0",

    "seaborn>=0.13.0"

]


[build-system]

requires = [
    "uv_build>=0.12.19,<0.13.0"
]

build-backend = "uv_build"
